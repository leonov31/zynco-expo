name: zynco
description: Zynco Connect - Local Services Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  go_router: ^13.0.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  timeago: ^3.6.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.png
