publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  go_router: ^13.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  video_player: ^2.8.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
